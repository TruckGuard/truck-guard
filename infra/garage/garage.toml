metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
rpc_secret = "${STORAGE_SECRET}"  # Docker image dxflrs/garage підтримує env substitution! [web:4]

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
add_host_to_metrics = true

[admin]
api_bind_addr = "[::]:3903"
admin_token = "${STORAGE_ROOT_PASSWORD}"
