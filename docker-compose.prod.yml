services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${MASTER_DB_USER}
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD}
      POSTGRES_DB: ${MASTER_DB_NAME}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CORE_DB_NAME: ${CORE_DB_NAME}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MASTER_DB_USER} -d ${MASTER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    depends_on:
      auth:
        condition: service_started
      ingestor:
        condition: service_started
      core:
        condition: service_started
    restart: always

  auth:
    image: ghcr.io/oleksiudatsko/truck-guard/auth:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@db:5432/${AUTH_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - WORKER_SYSTEM_KEY=${WORKER_SYSTEM_KEY}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080"

  ingestor:
    image: ghcr.io/oleksiudatsko/truck-guard/ingestor:latest
    restart: on-failure
    depends_on:
      valkey:
        condition: service_started
      garage:
        condition: service_healthy
    environment:
      - PORT=8080
      - VALKEY_ADDR=${VALKEY_ADDR}
      - STORAGE_ENDPOINT=garage:3900
      - STORAGE_ACCESS_KEY=local-admin
      - STORAGE_SECRET_KEY=local-admin
      - BUCKET_NAME=${STORAGE_BUCKET_NAME}
    ports:
      - "8082:8080"

  core:
    image: ghcr.io/oleksiudatsko/truck-guard/core:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${CORE_DB_USER}:${CORE_DB_PASSWORD}@db:5432/${CORE_DB_NAME}
      - PORT=8080
      - AUTH_SERVICE_URL=http://gateway/auth
    ports:
      - "8081:8080"

  camera-adapter:
    image: ghcr.io/oleksiudatsko/truck-guard/camera-adapter:latest
    restart: unless-stopped
    environment:
      - CORE_URL=http://gateway/api
      - ANPR_URL=http://anpr:8000/recognize
      - VALKEY_ADDR=${VALKEY_ADDR}
      - STORAGE_ENDPOINT=garage:3900
      - STORAGE_BUCKET=${STORAGE_BUCKET_NAME}
      - STORAGE_ACCESS_KEY=local-admin
      - STORAGE_SECRET_KEY=local-admin
      - WORKER_API_KEY=${WORKER_SYSTEM_KEY}
      - PYTHONUNBUFFERED=1
    depends_on:
      - valkey
      - core
      - garage

  weight-adapter:
    image: ghcr.io/oleksiudatsko/truck-guard/weight-adapter:latest
    restart: unless-stopped
    depends_on:
      - valkey
      - core
    environment:
      - CORE_URL=http://gateway/api
      - VALKEY_ADDR=${VALKEY_ADDR}
      - WORKER_API_KEY=${WORKER_SYSTEM_KEY}
      - PYTHONUNBUFFERED=1

  anpr:
    image: ghcr.io/oleksiudatsko/truck-guard/anpr:latest
    restart: unless-stopped
    environment:
      - TORCH_FORCE_WEIGHTS_ONLY_LOAD=0
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - nomeroff_models_cache:/root/.nomeroff_net

  valkey:
    image: valkey/valkey:8.0-alpine
    ports:
      - "6379:6379"
    restart: always

  garage:
    image: dxflrs/garage:v2.0.0
    restart: unless-stopped
    command: /garage server
    environment:
      - GARAGE_RPC_SECRET=${STORAGE_SECRET}
      - GARAGE_ADMIN_TOKEN=${STORAGE_ROOT_PASSWORD}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3903:3903" # Admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: alpine:3.18
    depends_on:
      garage:
        condition: service_started
    environment:
      - STORAGE_ROOT_USER=${STORAGE_ROOT_USER}
      - STORAGE_ROOT_PASSWORD=${STORAGE_ROOT_PASSWORD}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME}
      - GARAGE_RPC_SECRET=${STORAGE_SECRET}
      - GARAGE_ADMIN_TOKEN=${STORAGE_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        set -e;
        apk add --no-cache curl;
        wget -q -O /usr/local/bin/garage https://garagehq.deuxfleurs.fr/_releases/v2.0.0/x86_64-unknown-linux-musl/garage;
        chmod +x /usr/local/bin/garage;
        echo 'Waiting for Garage to be fully ready...';
        sleep 10;
        NODE_ID=$$(garage -u http://garage:3903 -t $$GARAGE_ADMIN_TOKEN status | grep 'Local node' | awk '{print $$3}');
        if [ -z \"$$NODE_ID\" ]; then echo \"Node ID not found\"; exit 1; fi;
        garage -u http://garage:3903 -t $$GARAGE_ADMIN_TOKEN layout assign $$NODE_ID -z garage -c 1G -t garage;
        garage -u http://garage:3903 -t $$GARAGE_ADMIN_TOKEN layout apply --version 1 || true;
        garage -u http://garage:3903 -t $$GARAGE_ADMIN_TOKEN bucket create ${STORAGE_BUCKET_NAME} || true;
        garage -u http://garage:3903 -t $$GARAGE_ADMIN_TOKEN bucket allow ${STORAGE_BUCKET_NAME} --key local-admin --read --write || true;
        echo 'Garage initialization complete';
      "

volumes:
  postgres_data:
  nomeroff_models_cache:
  garage_meta:
  garage_data:
